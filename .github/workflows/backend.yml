name: Backend CI/CD

on: 
  push:
      branches: [main, dev]
      paths: 
        - 'backend/**/'
  
  pull_request: 
    branches: [ main ]
    paths:
      - 'backend/**/'

  workflow_dispatch:
    

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/Mise/Mise.sln

      - name: Build
        run: dotnet build backend/Mise/Mise.sln --no-restore -c Release

      - name: Test 
        run: dotnet test backend/Mise/Mise.sln --no-build -c Release --verbosity normal