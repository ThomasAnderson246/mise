name: Frontend CI/CD


on: 
  push:
    branches: [main, dev ]
    paths: 
      - 'frontend/**'

  pull_request:
    branches: [main ] 
    paths: 
      - 'frontend/**'

jobs: 
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/mise-web/package-lock.json

      - name: Install dependencies
        run: npm ci 
        working-directory: frontend/mise-web 

      - name: Build
        run: npm run build
        working-directory: frontend/mise-web